name: Build HydroPaperDigest for Windows
on:
  workflow_dispatch:
  push:
    paths:
      - 'hydro-paper-digest/**'
      - '.github/workflows/build-hydro-windows.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: hydro-paper-digest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run backend tests
        run: python -m unittest discover -s tests -v
      - name: Install build tool
        run: python -m pip install pyinstaller==6.16.0
      - name: Build Windows executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name HydroPaperDigest app.py
      - uses: actions/upload-artifact@v4
        with:
          name: HydroPaperDigest-Windows
          path: hydro-paper-digest/dist/HydroPaperDigest.exe
          if-no-files-found: error
          retention-days: 30
